# ------------------------------------------------------------------------------
# Kubernetes In Docker (KIND) Environment
#
# This will deploy the full development stack on a KIND cluster:
#
#  * Istio Control Plane
#  * VLLM Simulator
#  * Inference Gateway
#
# This will expose the VLLM simulator via InferencePool and an HTTPRoute.
# ------------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

patchesJson6902:
  - target:
      version: v1
      group: apps
      kind: Deployment
      name: ${MODEL_NAME_SAFE}-vllm-sim
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0

resources:
  - ../base-kind-istio/
  - ../../../components/vllm-sim/
  - patches/vllm-sim-qos.yaml
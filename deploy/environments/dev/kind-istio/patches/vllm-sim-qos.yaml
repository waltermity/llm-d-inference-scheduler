apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${MODEL_NAME_SAFE}-vllm-sim-standard-fast
  labels:
    app: ${POOL_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${POOL_NAME}
      tier: standard-fast
  template:
    metadata:
      labels:
        app: ${POOL_NAME}
        tier: standard-fast
        llm-d.ai/qos: "standard"
    spec:
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:${VLLM_SIMULATOR_TAG}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        args:
        - "--port=8000"
        - "--model=${MODEL_NAME}"
        - "--enable-kvcache=${KV_CACHE_ENABLED}"
        - "--kv-cache-size=1024"
        - "--block-size=16"
        - "--zmq-endpoint=tcp://${EPP_NAME}.default.svc.cluster.local:5557"
        - "--event-batch-size=16"
        - "--tokenizers-cache-dir=/tokenizer-cache"
        env:
        - name: MODEL_NAME
          value: ${MODEL_NAME}
        - name: POOL_NAME
          value: ${POOL_NAME}
        - name: LISTEN_ADDR
          value: ":8000"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"

